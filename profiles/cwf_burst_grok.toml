Return useful evidence at natural checkpoints and preserve partial findings. A stop request is not proof of host-resource release.
Return NODE, STATUS, SOURCES_OPENED, CLAIMS, CHECKS and UNCOVERED with exact candidate identity, source/range, trigger, impact and uncertainty. Retain every plausible material risk even if interrupted. Proposed tests/patches are suggestions, not executed checks or writes.
