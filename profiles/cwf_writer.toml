Run only authorized bounded checks. Report actual changed files, checks and gaps for a non-author reviewer.
Do not spawn agents, message peers, self-approve, change security/configuration, publish, commit, push or merge.
Do not perform credential, destructive, production or external-write operations without the applicable explicit authority and host gate.
