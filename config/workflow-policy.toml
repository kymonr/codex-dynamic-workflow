version = 1
workflow_name = "dynamic-workflow"
default_shape = "simple_swarm"
allow_implicit_invocation = true
single_native_writer = true
native_grok_route = false

[simple_swarm]
implicit_min_ready_branches = 2
default_max_children = 6
hard_max_children = 8
typical_max_primary_files_per_branch = 3
max_objectives_per_branch = 1
max_wait_timeouts = 2
default_read_only = true
nested_delegation = false
root_duplicates_active_scope = false
managed_workflow_auto_trigger = false
worktree_writer_auto_trigger = false

[agent_fleet]
contract_version = 1
minimum_luna_agents = 4
default_luna_agents = 6
maximum_luna_agents = 12
default_max_concurrency = 6
maximum_max_concurrency = 12
conditional_sol_presets = ["adversarial-review", "repository-audit", "test-matrix"]
always_sol_presets = ["architecture-council", "competing-hypotheses"]
direct_agent_communication = false
nested_delegation = false
host_aggregation = true
majority_vote = false
read_only = true

[paths]
state_home_env = "DYNWF_HOME"
runs_root_env = "DYNWF_RUNS_ROOT"
worktree_root_env = "DYNWF_WORKTREE_ROOT"
app_dir_name = "codex-dynamic-workflow"

[limits.defaults]
max_result_bytes = 2097152
max_log_bytes = 8388608
max_run_artifact_bytes = 67108864
max_upstream_inline_bytes = 8192
max_event_bytes = 262144

[limits.hard_ceiling]
max_result_bytes = 67108864
max_log_bytes = 268435456
max_run_artifact_bytes = 1073741824
max_upstream_inline_bytes = 1048576
max_event_bytes = 1048576

[workflow_ir]
current_version = 3
static_execution_version = 2
control_flow_runtime_version = 3
validated_node_kinds = ["agent", "map", "verify", "loop", "reduce", "fleet_aggregate", "conditional", "human_gate"]
executable_node_kinds = ["agent", "map", "verify", "loop", "reduce", "fleet_aggregate", "conditional", "human_gate"]

[routes.spark]
agent_type = "spark"
model = "gpt-5.3-codex-spark"
effort = "high"
tier = "inherit"
access = "read_only"
max_nested_depth = 0

[routes.luna]
agent_type = "luna"
model = "gpt-5.6-luna"
effort = "max"
tier = "fast"
access = "read_or_scoped_writer"
max_nested_depth = 0

[routes.sol]
agent_type = "sol"
model = "gpt-5.6-sol"
effort = "xhigh"
tier = "default"
access = "read_or_scoped_writer"
max_nested_depth = 1
nested_route = "luna"

[routes.reviewer]
agent_type = "dynamic_workflow_sol_reviewer"
model = "gpt-5.6-sol"
effort = "xhigh"
tier = "inherit"
access = "read_only"
max_nested_depth = 0

[explicit_grok_task]
enabled = true
native = false
model = "xai/grok-4.6"
requires_explicit_user_request = true
requires_separate_visible_task = true

[workflow_ir.control_flow]
trusted_runtime = true
arbitrary_code_execution = false
source_reference_mode = "exact_node_id"
map_manifest_version = 1
verify_manifest_version = 1
verification_verdicts = ["accept", "reject", "unknown"]
resume_reuses_succeeded_children = true
semantic_reject_is_data = true
dependency_policies = ["all_succeeded", "join"]
default_dependency_policy = "all_succeeded"
skipped_propagates_by_default = true
join_requires_succeeded_dependency = true
token_budget_mode = "advisory"
timeout_scope = "per_agent"

[workflow_ir.bounded_loop]
contract_version = 1
body_kind = "agent_templates"
body_min = 2
body_max = 8
stop_when = "verification_accept"
no_progress = "canonical_sha256"
no_progress_default = 1
no_progress_min = 1
no_progress_max = 5
resume_reuses_succeeded_steps = true
deadline_mode = "absolute_epoch"
workflow_timeout_min_seconds = 60
workflow_timeout_max_seconds = 172800
pause_counts_against_deadline = true
arbitrary_expression = false

[workflow_ir.conditional]
expression_language = false
source_reference_mode = "exact_node_id"
json_pointer = true
unknown_outcome = "needs_escalation"
non_selected_state = "skipped"

[workflow_ir.human_gate]
record_version = 1
status_values = ["waiting", "decided"]
decision_sources = ["user", "host"]
input_identity = "sha256"
terminal_decision_immutable = true
decision_write_mode = "exclusive_create"
decision_record_suffix = ".decision.json"
actor_source_are_authentication = false
grants_authority = false
