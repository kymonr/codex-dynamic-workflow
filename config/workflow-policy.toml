version = 1
workflow_name = "dynamic-workflow"
default_shape = "execute"
allow_implicit_invocation = true
single_native_writer = true
native_grok_route = false

[paths]
state_home_env = "DYNWF_HOME"
runs_root_env = "DYNWF_RUNS_ROOT"
worktree_root_env = "DYNWF_WORKTREE_ROOT"
app_dir_name = "codex-dynamic-workflow"

[limits.defaults]
max_result_bytes = 2097152
max_log_bytes = 8388608
max_run_artifact_bytes = 67108864
max_upstream_inline_bytes = 8192
max_event_bytes = 262144

[limits.hard_ceiling]
max_result_bytes = 67108864
max_log_bytes = 268435456
max_run_artifact_bytes = 1073741824
max_upstream_inline_bytes = 1048576
max_event_bytes = 1048576

[workflow_ir]
current_version = 3
static_execution_version = 2
control_flow_runtime_version = 3
validated_node_kinds = ["agent", "map", "verify", "loop", "reduce", "conditional", "human_gate"]
executable_node_kinds = ["agent", "map", "verify", "reduce", "conditional", "human_gate"]

[routes.spark]
agent_type = "spark"
model = "gpt-5.3-codex-spark"
effort = "high"
tier = "inherit"
access = "read_only"
max_nested_depth = 0

[routes.luna]
agent_type = "luna"
model = "gpt-5.6-luna"
effort = "max"
tier = "fast"
access = "read_or_scoped_writer"
max_nested_depth = 0

[routes.sol]
agent_type = "sol"
model = "gpt-5.6-sol"
effort = "xhigh"
tier = "default"
access = "read_or_scoped_writer"
max_nested_depth = 1
nested_route = "luna"

[routes.reviewer]
agent_type = "dynamic_workflow_sol_reviewer"
model = "gpt-5.6-sol"
effort = "xhigh"
tier = "inherit"
access = "read_only"
max_nested_depth = 0

[explicit_grok_task]
enabled = true
native = false
model = "xai/grok-4.6"
requires_explicit_user_request = true
requires_separate_visible_task = true

[workflow_ir.control_flow]
trusted_runtime = true
arbitrary_code_execution = false
source_reference_mode = "exact_node_id"
map_manifest_version = 1
verify_manifest_version = 1
verification_verdicts = ["accept", "reject", "unknown"]
resume_reuses_succeeded_children = true
semantic_reject_is_data = true
dependency_policies = ["all_succeeded", "join"]
default_dependency_policy = "all_succeeded"
skipped_propagates_by_default = true
join_requires_succeeded_dependency = true
token_budget_mode = "advisory"
timeout_scope = "per_agent"

[workflow_ir.conditional]
expression_language = false
source_reference_mode = "exact_node_id"
json_pointer = true
unknown_outcome = "needs_escalation"
non_selected_state = "skipped"

[workflow_ir.human_gate]
record_version = 1
status_values = ["waiting", "decided"]
decision_sources = ["user", "host"]
input_identity = "sha256"
terminal_decision_immutable = true
decision_write_mode = "exclusive_create"
decision_record_suffix = ".decision.json"
actor_source_are_authentication = false
grants_authority = false
