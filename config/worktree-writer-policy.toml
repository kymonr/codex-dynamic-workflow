# Worktree Writer v1 is an explicit, isolated candidate producer. It is not a
# Workflow IR node kind and cannot be activated by Auto Planner or Bounded Loop.

[worktree_writer]
runtime_version = 1
explicit_cli_only = true
single_active_writer_per_repository = true
auto_planner_activation = false
workflow_ir_activation = false
automatic_resume = false
automatic_retry = false
automatic_apply = false
automatic_commit = false
automatic_push = false
automatic_merge = false
automatic_release = false
automatic_deploy = false

[worktree_writer.package]
closed_schema = true
canonical_digest = "sha256-canonical-json"
allowed_actions = ["create", "modify"]
repo_relative_posix_paths = true
case_insensitive_uniqueness = true

[worktree_writer.writer]
role = "luna"
model = "gpt-5.6-luna"
effort = "max"
tier = "fast"
attempts = 1
retry = 0
upgrade = "none"
sandbox = "workspace-write"
network = false
shell_tool = false
code_mode = false
multi_agent = false
edit_tool = "apply_patch-only"

[worktree_writer.reviewer]
agent_type = "dynamic_workflow_sol_reviewer"
model = "gpt-5.6-sol"
effort = "xhigh"
attempts = 1
retry = 0
upgrade = "none"
sandbox = "read-only"
fresh_process = true
write_authority = false

[worktree_writer.effects]
reconcile_from_live_git_and_filesystem = true
forbid_delete = true
forbid_rename = true
forbid_mode_change = true
forbid_binary = true
forbid_symlink_or_reparse = true
forbid_submodule_or_lfs = true
forbid_git_metadata_write = true
forbid_external_write = true

[worktree_writer.candidate]
text_only_patch = true
capture_untracked_content = true
freeze_before_review = true
terminal_verdicts = ["ship_candidate", "fix_first", "rethink"]
