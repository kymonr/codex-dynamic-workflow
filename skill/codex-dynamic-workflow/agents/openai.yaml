interface:
  display_name: "Codex Dynamic Workflow"
  short_description: "Implicit Luna and Grok probes; explicit full workflow"
  default_prompt: "Use $codex-dynamic-workflow in explicit full-workflow mode: Astra plans and sets acceptance checks. Keep the current main conversation as Root and direct one cwf_sol_writer child through implementation, tests and bounded repair without duplicating its writes or approving routine steps one by one. After the writer stops, use a fresh read-only Astra context to review the full actual diff against the original goal. Preserve one active writer, cumulative budget, ownership, authorization and existing Runtime contracts; main-conversation direct writing and true controller transfer remain explicit user-selected alternatives."
policy:
  allow_implicit_invocation: true
