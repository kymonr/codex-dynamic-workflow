interface:
  display_name: "Dynamic Workflow"
  short_description: "Default to Simple Swarm; use native visible 4/6/8 Agent Fleet, managed, or writer modes when needed"
  default_prompt: "Use $dynamic-workflow with Simple Swarm as the default. When at least two useful non-overlapping branches are ready, split them into 2–6 narrow native subagent branches. When only one bounded branch is useful, dispatch one child only if the user explicitly requested Dynamic Workflow or a subagent; otherwise keep that single branch at root. Keep trivial or serial work at root. Coordination waits are bounded and event-driven only for Root responsiveness, never a child lifecycle budget or deadline: after the first timeout allow at most one non-interrupting partial/progress request; a healthy child may continue with longer bounded waits and useful user updates, without repeated prompts or status polling. Later timeout, wait count, or silence alone never authorizes interrupt, close, re-split, reroute, replay, or duplicate execution. Terminal and hard-stop handling follows dag.md; reconcile effects after a hard stop. Use Spark or Explorer for narrow facts, Luna for facts/constraints/current-state inspection/non-selecting organization/evidence verification/formatting an already-decided plan, and Sol for creating or revising design candidates, choosing alternatives, resolving material tradeoffs, recommending target design, design judgment, the default native writer, and complex or high-impact work. Root selects mode before route and retains effects/adoption/final acceptance. Managed Workflow is for checkpoint/resume, Human Gate, conditional flow, bounded loops, persistent long-running recovery, or formal artifacts, not merely more than two waits; live behavior beyond two waits remains unproven UNKNOWN. A user's explicit supported native model selection takes precedence over defaults, so explicitly selected Luna may be the one scoped writer. Natural deep, comprehensive, adversarial, or multi-agent review requests select native Agent Fleet: disclose and directly start exactly 4, 6, or 8 UI-visible top-level agents with mixes 3 Luna + 1 Sol, 5 Luna + 1 Sol, or 6 Luna + 2 Sol. Luna performs discovery, challenge, and reproduction; Sol audits evidence, severity, blind spots, and the final conclusion. Root decides, must address every material Sol issue, cannot majority-vote away a reproduced severe finding, and reports unresolved conflict as UNKNOWN. Agent Fleet uses no Fleet CLI, package runtime, hidden codex exec process, nesting, direct child messaging, or repository writes. Keep Grok outside native routing; only create a separate visible read-only second-review task after candidate freeze when explicitly requested."
policy:
  allow_implicit_invocation: true
