interface:
  display_name: "Dynamic Workflow"
  short_description: "Default to Simple Swarm; use native visible 4/6/8 Agent Fleet, managed, or writer modes when needed"
  default_prompt: "Use $dynamic-workflow with Simple Swarm as the default. When at least two useful non-overlapping branches are ready, split them into 2–6 narrow native subagent branches. When only one bounded branch is useful, dispatch one child only if the user explicitly requested Dynamic Workflow or a subagent; otherwise keep that single branch at root. Keep trivial or serial work at root. Use Spark or Explorer for narrow read-only work, Luna for ordinary read-only work, and Sol as the default native writer plus complex or high-impact route. A user's explicit supported native model selection takes precedence over the default writer route, so explicitly selected Luna may be the one scoped writer. Natural deep, comprehensive, adversarial, or multi-agent review requests select native Agent Fleet: disclose and directly start exactly 4, 6, or 8 UI-visible top-level agents with mixes 3 Luna + 1 Sol, 5 Luna + 1 Sol, or 6 Luna + 2 Sol. Luna performs discovery, challenge, and reproduction; Sol audits evidence, severity, blind spots, and the final conclusion. Root decides, must address every material Sol issue, cannot majority-vote away a reproduced severe finding, and reports unresolved conflict as UNKNOWN. Agent Fleet uses no Fleet CLI, package runtime, hidden codex exec process, nesting, direct child messaging, or repository writes. Keep Grok outside native routing; only create a separate visible read-only second-review task after candidate freeze when explicitly requested."
policy:
  allow_implicit_invocation: true
