interface:
  display_name: "Dynamic Workflow"
  short_description: "Default to Simple Swarm; use 4–12 Agent Fleet, managed, or writer modes only when needed"
  default_prompt: "Use $dynamic-workflow with Simple Swarm as the default. When at least two useful non-overlapping branches are ready, split them into 2–6 narrow native subagent branches. When only one bounded branch is useful, dispatch one child only if the user explicitly requested Dynamic Workflow or a subagent; otherwise keep that single branch at root. Keep trivial or serial work at root. Keep root integration and final verification, use Spark or Explorer for narrow read-only work, Luna for ordinary read-only work, and Sol as the default native writer plus complex or high-impact route. A user's explicit supported native model selection takes precedence over the default writer route, so explicitly selected Luna may be the one scoped writer. Enable Agent Fleet, Managed Workflow, or Writer Workflow only when explicitly needed or authorized. Agent Fleet is the exact 4–12 read-only Luna path with host aggregation and conditional Sol; do not use majority voting. Keep Grok outside native routing; only create a separate visible read-only second-review task after the candidate is frozen and the user explicitly requests it."
policy:
  allow_implicit_invocation: true
